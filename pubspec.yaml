name: pookie_prep
description: Pookie Prep — Bengali GK practice app for medical admission aspirants.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600

  # Bundle fonts (do not fetch at runtime). Download Hind Siliguri and Baloo Da 2
  # from Google Fonts, put the .ttf files in assets/fonts/, then uncomment:
  #
  # fonts:
  #   - family: HindSiliguri
  #     fonts:
  #       - asset: assets/fonts/HindSiliguri-Regular.ttf
  #       - asset: assets/fonts/HindSiliguri-SemiBold.ttf
  #         weight: 600
  #   - family: BalooDa2
  #     fonts:
  #       - asset: assets/fonts/BalooDa2-Bold.ttf
  #         weight: 700
